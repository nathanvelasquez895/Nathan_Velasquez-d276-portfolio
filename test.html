<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    header {
      position: relative;
      width: 100%;
      height: 260px;
      background-color: #1a0808; /* Dark base background */
      overflow: hidden;
    }

    #waveCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .header-content {
      position: relative;
      z-index: 2;
      padding: 2rem;
      color: white;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <header>
    <canvas id="waveCanvas"></canvas>
    <div class="header-content">
      <h1>Your Name</h1>
      <p>Portfolio & Resume</p>
    </div>
  </header>

  <script>
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      drawWaves();
    }

    function drawWaves() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const lineCount = 45; // Number of fine ribbon lines
      const width = canvas.width;
      const height = canvas.height;

      for (let i = 0; i < lineCount; i++) {
        const offset = i * 4;
        ctx.beginPath();
        
        // Starting point
        ctx.moveTo(0, height * 0.7 + Math.sin(i * 0.05) * 20);

        // Bezier curve controls to create flowing mesh loops
        ctx.bezierCurveTo(
          width * 0.25, height * 0.2 + offset * 0.5,
          width * 0.5, height * 1.1 - offset,
          width * 0.75, height * 0.3 + offset * 0.2
        );
        
        ctx.bezierCurveTo(
          width * 0.88, height * 0.05,
          width * 0.95, height * 0.5,
          width, height * 0.4 + offset * 0.3
        );

        // Teal to Blue color gradient mapping across lines
        const ratio = i / lineCount;
        const r = Math.floor(13 + ratio * 20);
        const g = Math.floor(148 + ratio * 30);
        const b = Math.floor(136 + ratio * 100);
        
        ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.6)`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    }

    window.addEventListener('resize', resize);
    resize();
  </script>

</body>
</html>
